<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Gabriel Nunes — Software Engineer</title>
<desc id="desc">Banner autoral em estilo editorial técnico, com monograma GN, linhas de arquitetura e detalhes em verde-lima.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D16"/><stop offset=".58" stop-color="#101B29"/><stop offset="1" stop-color="#071018"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D6FF63"/><stop offset="1" stop-color="#63F5C8"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#B8D5E5" stroke-opacity=".07" stroke-width="1"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
</defs>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
<rect width="1200" height="360" rx="18" fill="url(#grid)"/>
<circle cx="1040" cy="44" r="140" fill="#57EFC4" opacity=".08" filter="url(#soft)"/>
<path d="M0 294H1200" stroke="#D6FF63" stroke-opacity=".5"/>
<path d="M40 0V360M1160 0V360" stroke="#D6FF63" stroke-opacity=".18"/>
<rect x="48" y="42" width="92" height="24" rx="12" fill="#D6FF63"/>
<text x="94" y="58" fill="#101820" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.6">GN / 001</text>
<text x="47" y="198" fill="#F3F6F2" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="-9">GN</text>
<path d="M50 222H148" stroke="url(#glow)" stroke-width="5"/>
<text x="178" y="127" fill="#D6FF63" font-family="monospace" font-size="12" letter-spacing="3">ENGENHARIA DE SOFTWARE</text>
<text x="174" y="178" fill="#F3F6F2" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.3">Gabriel Nunes</text>
<text x="178" y="211" fill="#AAB9C7" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing=".5">Backend-first. Full-stack mindset.</text>
<text x="178" y="258" fill="#F3F6F2" font-family="monospace" font-size="12" letter-spacing="1.4">JAVA  /  SPRING BOOT  /  .NET  /  ANGULAR</text>
<path d="M790 48V265" stroke="#9EB5C8" stroke-opacity=".25"/>
<text x="826" y="65" fill="#8FA5B7" font-family="monospace" font-size="11" letter-spacing="2">CURRENT_BUILD</text>
<circle cx="1123" cy="61" r="5" fill="#D6FF63"/>
<text x="826" y="108" fill="#D6FF63" font-family="monospace" font-size="14">const mindset = {</text>
<text x="848" y="138" fill="#E7EEF3" font-family="monospace" font-size="13">curiosity: true,</text>
<text x="848" y="164" fill="#E7EEF3" font-family="monospace" font-size="13">cleanCode: "always",</text>
<text x="848" y="190" fill="#E7EEF3" font-family="monospace" font-size="13">impact: "real problems"</text>
<text x="826" y="220" fill="#D6FF63" font-family="monospace" font-size="14">};</text>
<text x="48" y="329" fill="#8FA5B7" font-family="monospace" font-size="10" letter-spacing="2">BRASÍLIA, BRASIL</text>
<text x="1152" y="329" fill="#8FA5B7" font-family="monospace" font-size="10" text-anchor="end" letter-spacing="2">BUILD WITH INTENTION — 2026</text>
<path d="M1090 286l14 0 0 14M1120 286h14v14" stroke="#D6FF63" stroke-width="1.5" fill="none"/>
</svg>